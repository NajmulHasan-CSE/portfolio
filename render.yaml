services:
  - type: web
    name: najmul-portfolio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: najmul-portfolio-api
          property: host
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: najmul-portfolio-web
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: najmul-portfolio-db
          property: connectionString
      - key: NUM_PROXIES
        value: "1"
  - type: web
    name: najmul-portfolio-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: najmul-portfolio-api
          property: host
      - key: NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY
        sync: false
databases:
  - name: najmul-portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: free
